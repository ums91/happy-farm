<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#83bd59"><title>Happy Farm</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d9edc3;color:#29472d;font:14px Verdana,Arial,sans-serif}header{background:linear-gradient(#fff9e9,#efdfb5);border-bottom:5px solid #a8cc77;padding:12px max(12px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}h1{font: bold 32px Georgia;color:#427c3d;margin:0}.sub{font-size:10px;letter-spacing:1px;color:#78915b}.stats{display:flex;gap:8px}.stat{background:#fffdf2;border:2px solid #dfcc91;border-radius:20px;padding:8px 12px;font-weight:bold}main{max-width:1100px;margin:auto;padding:12px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#f8edcf;border:2px solid white;border-radius:12px;padding:9px;box-shadow:0 3px #d3c18c}.tool{background:linear-gradient(white,#e9e2c9);border:2px solid #c6b88c;border-radius:9px;padding:8px 11px;font-weight:bold;color:#4b6039}.tool.active{background:linear-gradient(#ffec9e,#f2c75d);border-color:#b78b32}.xp{margin-left:auto;font-size:11px;font-weight:bold}.bar{display:inline-block;width:90px;height:9px;background:#d6d2b5;border-radius:9px;overflow:hidden;vertical-align:middle}.bar i{display:block;height:100%;background:#6caf4b}.world{margin-top:12px;border:7px solid #f7e9c1;border-radius:15px;overflow:auto;box-shadow:0 5px #c5a86c;background:#8acb67;max-height:calc(100vh - 235px);min-height:400px}canvas{display:block;width:100%;min-width:650px;height:auto;touch-action:manipulation}.bottom{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}.status{background:#fff9e8;border:2px solid white;border-radius:10px;padding:10px;box-shadow:0 3px #d3c18e}.btn{background:linear-gradient(#82c55c,#4e9842);border:2px solid #3c7b37;border-radius:9px;color:white;padding:9px 13px;font-weight:bold}.btn.gold{background:linear-gradient(#ffe18a,#eeb43e);color:#674a1d;border-color:#b8892c}.modal{display:none;position:fixed;inset:0;background:#183a2dbb;z-index:5;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.box{background:#fff8e7;border:5px solid #e3c77d;border-radius:16px;width:min(520px,100%);max-height:85vh;overflow:auto}.boxhead{padding:13px;background:#e9f3d6;display:flex;justify-content:space-between;font:bold 20px Georgia}.seeds{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.seed{border:2px solid #e8d9ad;background:#fffdf5;border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px}.seed button{background:#70ad4e;color:white;border:0;border-radius:7px;padding:7px}.seed span{font-size:26px}.seed small{display:block}.close{background:#c66b50;color:white;border:0;border-radius:50%;width:28px;height:28px}@media(max-width:650px){header{justify-content:center}.stats{justify-content:center}.xp{width:100%;margin:5px 0;text-align:center}.world{max-height:calc(100vh - 260px)}.seeds{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand"><span style="font-size:40px">🌻</span><div><h1>Happy Farm</h1><div class="sub">A LITTLE PATCH OF HAPPINESS</div></div></div><div class="stats"><div class="stat">🪙 <b id="coins">250</b></div><div class="stat">⭐ Level <b id="level">1</b></div><div class="stat">📦 <b id="barn">0</b></div></div></header>
<main><div class="toolbar"><button class="tool active" data-mode="select">👆 Select</button><button class="tool" data-mode="plow">⛏️ Plow</button><button class="tool" data-mode="plant">🌱 Plant</button><button class="tool" data-mode="water">💧 Water</button><button class="tool" data-mode="harvest">🌾 Harvest</button><button class="tool" id="marketBtn">🛒 Market</button><span class="xp">XP <span id="xp">0</span>/100 <span class="bar"><i id="xpbar"></i></span></span></div>
<div class="world"><canvas id="farm" width="960" height="640"></canvas></div><div class="bottom"><div class="status" id="status">Welcome! Plow a grassy tile to start your farm.</div><button class="btn gold" id="sell">🧺 Sell harvest</button></div></main>
<div class="modal" id="market"><div class="box"><div class="boxhead">🌻 Country Market <button class="close" id="close">×</button></div><div class="seeds" id="seeds"></div></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),cv=$('farm'),ctx=cv.getContext('2d'),cols={wheat:{n:'Wheat',e:'🌾',cost:8,price:18,time:35,xp:8},carrot:{n:'Carrot',e:'🥕',cost:13,price:29,time:55,xp:12},corn:{n:'Corn',e:'🌽',cost:20,price:46,time:85,xp:18},potato:{n:'Potato',e:'🥔',cost:17,price:38,time:70,xp:15},berry:{n:'Strawberry',e:'🍓',cost:28,price:68,time:115,xp:24}},W=12,H=8,T=64,X=96,Y=56,key='happyFarmClassic';let s;try{s=JSON.parse(localStorage.getItem(key))}catch{}if(!s||!Array.isArray(s.fields))s={coins:250,xp:0,fields:Array.from({length:W*H},()=>({soil:false,crop:null,at:0,water:false})),barn:{}};let mode='select',seed='wheat',timer;
const save=()=>localStorage.setItem(key,JSON.stringify(s)),level=()=>Math.floor(s.xp/100)+1;
function msg(t){$('status').textContent=t;clearTimeout(timer);timer=setTimeout(()=>{$('status').textContent='Choose a tool and tap a field tile.'},3500)}
function em(e,x,y,z){ctx.font=z+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,x,y)}
function tree(x,y){ctx.fillStyle='#805333';ctx.fillRect(x-4,y+5,8,23);ctx.fillStyle='#397c3d';ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.fill();ctx.fillStyle='#72ae4e';ctx.beginPath();ctx.arc(x-9,y-9,13,0,7);ctx.fill()}
function house(x,y,w,h,wall,roof,label,icon){ctx.fillStyle='#0003';ctx.fillRect(x+5,y+h-2,w,h*.12);ctx.fillStyle=wall;ctx.fillRect(x,y,w,h);ctx.fillStyle=roof;ctx.beginPath();ctx.moveTo(x-8,y+5);ctx.lineTo(x+w/2,y-h*.48);ctx.lineTo(x+w+8,y+5);ctx.fill();ctx.strokeStyle='#70472b';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#70472b';ctx.fillRect(x+w*.42,y+h*.48,w*.18,h*.52);ctx.fillStyle='#c5e8ed';ctx.fillRect(x+w*.12,y+h*.3,w*.2,h*.2);ctx.fillRect(x+w*.68,y+h*.3,w*.2,h*.2);ctx.fillStyle='white';ctx.font='bold 11px Verdana';ctx.textAlign='center';ctx.fillText(label,x+w/2,y+h+14);em(icon,x+w/2,y+h*.2,21)}
function draw(){let g=ctx.createLinearGradient(0,0,0,640);g.addColorStop(0,'#a8d77c');g.addColorStop(1,'#72b85b');ctx.fillStyle=g;ctx.fillRect(0,0,960,640);for(let i=0;i<65;i++){ctx.fillStyle=i%2?'#ffffff0a':'#386f3210';ctx.beginPath();ctx.ellipse(i*137%950,i*83%630,18,7,.3,0,7);ctx.fill()}ctx.strokeStyle='#d8bb82';ctx.lineWidth=48;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(15,500);ctx.bezierCurveTo(180,440,210,540,400,500);ctx.bezierCurveTo(600,450,720,540,950,470);ctx.stroke();ctx.strokeStyle='#ead4a4';ctx.lineWidth=3;ctx.setLineDash([10,12]);ctx.stroke();ctx.setLineDash([]);tree(55,95);tree(65,190);tree(900,105);tree(900,220);tree(55,570);tree(900,570);house(35,300,92,72,'#f0d9a6','#b85d43','Farmhouse','🏡');house(790,295,112,82,'#d9b276','#a94e39','Barn','🚜');house(800,440,80,55,'#e7d39b','#a65b40','Silo','🌽');ctx.strokeStyle='#e8d3a0';ctx.lineWidth=7;ctx.strokeRect(X-12,Y-12,W*T+24,H*T+24);for(let i=0;i<s.fields.length;i++){let f=s.fields[i],x=X+i%W*T,y=Y+Math.floor(i/W)*T;if(!f.soil){ctx.fillStyle=(i%W+Math.floor(i/W))%2?'#86c65e':'#7cbd55';ctx.fillRect(x,y,T,T);ctx.strokeStyle='#6ba74c';ctx.lineWidth=1;ctx.strokeRect(x,y,T,T)}else{ctx.fillStyle='#98613b';ctx.fillRect(x,y,T,T);ctx.fillStyle='#b47a4d';for(let k=0;k<4;k++)ctx.fillRect(x+5,y+8+k*14,T-10,4);ctx.strokeStyle='#71452c';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,T-4,T-4)}if(f.crop){let c=cols[f.crop],r=Math.min(1,(Date.now()-f.at)/1000/c.time);em(r<.3?'🌱':r<.72?'🪴':c.e,x+32,y+29,r<.3?24:36);if(r>=1){ctx.fillStyle='#fff1a9';ctx.beginPath();ctx.roundRect(x+7,y+46,50,14,7);ctx.fill();ctx.fillStyle='#6c4c20';ctx.font='bold 9px Verdana';ctx.textAlign='center';ctx.fillText('READY',x+32,y+56)}else{ctx.fillStyle='#3d2b1d';ctx.fillRect(x+9,y+52,46,5);ctx.fillStyle='#b9e66b';ctx.fillRect(x+9,y+52,46*r,5)}if(f.water)em('💧',x+51,y+11,13)}}for(let i=0;i<15;i++)em(i%2?'🌼':'🌸',18+(i*59)%925,30+(i*41)%590,12)}
function update(){ $('coins').textContent=s.coins;$('level').textContent=level();$('barn').textContent=Object.values(s.barn).reduce((a,b)=>a+b,0);$('xp').textContent=s.xp%100;$('xpbar').style.width=(s.xp%100)+'%';draw();save()}
function act(e){let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height,c=Math.floor((x-X)/T),row=Math.floor((y-Y)/T);if(c<0||c>=W||row<0||row>=H)return;let f=s.fields[row*W+c],crop=cols[seed];if(mode==='plow'){if(f.soil){msg('This plot is already plowed.');return}f.soil=true;msg('Soil plowed. Choose Plant!')}else if(mode==='plant'){if(!f.soil||f.crop){msg('Plow an empty plot first.');return}if(s.coins<crop.cost){msg('Not enough coins for '+crop.n+'.');return}s.coins-=crop.cost;f.crop=seed;f.at=Date.now();f.water=false;msg(crop.n+' planted!')}else if(mode==='water'){if(!f.crop){msg('Plant a crop first.');return}if(!f.water){f.water=true;f.at-=cols[f.crop].time*1000*.15}msg('Watered! Crop growth boosted.')}else{if(!f.crop){msg('Nothing planted here.');return}let c=cols[f.crop];if(Date.now()-f.at<c.time*1000){msg(c.n+' is still growing.');return}s.barn[f.crop]=(s.barn[f.crop]||0)+1;s.xp+=c.xp;f.crop=null;f.soil=false;msg('Harvested '+c.n+'! +'+c.xp+' XP') }update()}
cv.addEventListener('click',act);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));msg('Tool selected: '+mode+'. Tap a field.')});
function market(){let list=$('seeds');list.innerHTML='';Object.entries(cols).forEach(([k,c])=>{let d=document.createElement('div');d.className='seed';d.innerHTML='<span>'+c.e+'</span><div><b>'+c.n+'</b><small>🪙 '+c.cost+' · Sell '+c.price+' · '+c.time+' sec</small></div><button>Choose</button>';d.querySelector('button').onclick=()=>{seed=k;mode='plant';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='plant'));$('market').classList.remove('open');msg(c.n+' selected. Tap a plowed plot.');};list.appendChild(d)});$('market').classList.add('open')}
$('marketBtn').onclick=market;$('close').onclick=()=>$('market').classList.remove('open');$('market').onclick=e=>{if(e.target===$('market'))$('market').classList.remove('open')};$('sell').onclick=()=>{let total=0,n=0;Object.entries(s.barn).forEach(([k,v])=>{total+=cols[k].price*v;n+=v});if(!n){msg('Barn is empty. Harvest crops first.');return}s.barn={};s.coins+=total;msg('Sold '+n+' harvest for '+total+' coins!');update()};update();setInterval(draw,1000);
})();</script></body></html>
