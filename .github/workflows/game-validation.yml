name: Game client validation

# Manual execution only. No push, pull_request or schedule triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Type-check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install dependencies
        working-directory: game
        run: npm ci
      - name: Type-check and build
        working-directory: game
        run: npm run build
