name: Game client validation

# Manual execution only. No push, pull_request or schedule triggers.
# npm install is used until the first package lock is generated and committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Type-check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: game
        run: npm install
      - name: Type-check and build
        working-directory: game
        run: npm run build
